name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint:
    name: Lint & Style (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: arma3-sqf-skill

      - name: Checkout a3ref knowledge base
        uses: actions/checkout@v4
        with:
          repository: a3ref/data
          path: Wiki/data
          fetch-depth: 1

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        working-directory: arma3-sqf-skill
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Pytest Suite
        working-directory: arma3-sqf-skill
        env:
          SQF_WIKI_DATA_PATH: ${{ github.workspace }}/Wiki/data
        run: |
          python -m pytest tests/ -v --cov=skills/arma3-sqf-skill/scripts --cov-report=term-missing

      - name: Run local gate (fase PR-1)
        working-directory: arma3-sqf-skill
        env:
          SQF_WIKI_DATA_PATH: ${{ github.workspace }}/Wiki/data
        run: |
          python scripts/check.py --fase PR-1
